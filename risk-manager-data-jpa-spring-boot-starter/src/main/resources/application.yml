spring:
  datasource:
    url: jdbc:postgresql://risk-repository/risk-manager
    driverClassName: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:/db/migration/{vendor}
  security:
    basic:
      enabled: false
security:
  basic:
    enabled: false
